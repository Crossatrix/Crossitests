<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ed;
    --muted: #8b8f9a;
    --accent: #6d5dfc;
    --accent-hover: #7d6dff;
    --user-bubble: #2a2740;
    --ai-bubble: #1e2129;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Password Gate ---------- */
  #gate {
    width: 100%;
    max-width: 360px;
    padding: 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-align: center;
  }
  #gate h1 { font-size: 18px; margin-bottom: 4px; }
  #gate p { color: var(--muted); font-size: 13px; margin-top: 0; margin-bottom: 20px; }
  #gate input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0d0f14;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 12px;
  }
  #gate button, #chat-controls button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  #gate button:hover { background: var(--accent-hover); }
  #gate-error { color: #ff6b6b; font-size: 13px; margin-top: 8px; min-height: 16px; }

  /* ---------- Chat App ---------- */
  #app {
    display: none;
    width: 100%;
    max-width: 720px;
    height: 100vh;
    flex-direction: column;
  }
  #header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--panel);
  }
  #header input {
    flex: 1;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0d0f14;
    color: var(--text);
    font-size: 13px;
  }
  #header label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 3px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--ai-bubble);
    border-bottom-left-radius: 3px;
  }
  .msg.error {
    align-self: center;
    background: #3a1f1f;
    color: #ff9b9b;
    font-size: 13px;
  }
  .msg.system {
    align-self: center;
    color: var(--muted);
    font-size: 12px;
    background: transparent;
  }
  #input-row {
    display: flex;
    gap: 10px;
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #input-row textarea {
    flex: 1;
    resize: none;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0d0f14;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
  }
  #input-row button {
    padding: 0 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  #input-row button:hover { background: var(--accent-hover); }
  #input-row button:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-style: italic; font-size: 13px; }

  .msg-wrap {
    display: flex;
    flex-direction: column;
    max-width: 78%;
  }
  .msg-wrap.user { align-self: flex-end; align-items: flex-end; }
  .msg-wrap.ai { align-self: flex-start; align-items: flex-start; }
  .msg-wrap .msg { max-width: 100%; }
  .json-btn {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .json-btn:hover { color: var(--text); border-color: var(--accent); }

  /* ---------- JSON Modal ---------- */
  #json-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #json-modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 90%;
    max-width: 700px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #json-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  #json-modal-header h2 { font-size: 14px; margin: 0; }
  #json-modal-header div { display: flex; gap: 8px; }
  #json-modal-header button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  #json-modal-header button:hover { background: var(--accent-hover); }
  #json-modal-close {
    background: transparent !important;
    color: var(--muted);
    font-size: 16px !important;
    padding: 6px 10px !important;
  }
  #json-modal-body {
    padding: 16px;
    overflow: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    color: #c9d1d9;
  }
</style>
</head>
<body>

  <!-- Password Gate -->
  <div id="gate">
    <h1>🔒 Protected Chat</h1>
    <p>Enter the password to continue</p>
    <input type="password" id="password-input" placeholder="Password" autofocus>
    <button onclick="checkPassword()">Enter</button>
    <div id="gate-error"></div>
  </div>

  <!-- Chat App -->
  <div id="app">
    <div id="header">
      <label for="model-input">Model ID</label>
      <input type="text" id="model-input" placeholder="e.g. openai/gpt-4o, anthropic/claude-3.5-sonnet" value="openai/gpt-4o-mini">
    </div>
    <div id="messages"></div>
    <div id="input-row">
      <textarea id="user-input" placeholder="Type a message..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- JSON Modal (dev view) -->
  <div id="json-modal-overlay" onclick="if(event.target===this) closeJsonModal()">
    <div id="json-modal">
      <div id="json-modal-header">
        <h2>Raw API Response</h2>
        <div>
          <button onclick="copyJson()">Copy</button>
          <button id="json-modal-close" onclick="closeJsonModal()">✕</button>
        </div>
      </div>
      <div id="json-modal-body"></div>
    </div>
  </div>

<script>
  // =====================================================================
  // CONFIG
  // =====================================================================
  // Change this to whatever password you want to gate the site with.
  const SITE_PASSWORD = "changeme123";

  // OpenRouter API key.
  // WARNING: This key is embedded in plain text in this HTML file.
  // Anyone who views the page source, opens browser DevTools, or gets a
  // copy of this file can read and use this key directly (e.g. via curl),
  // regardless of the password screen above. The password only hides the
  // chat UI from casual visitors — it does NOT protect the key itself.
  // If you've restricted this key in the OpenRouter dashboard (e.g. to
  // specific origins/referrers), understand that such restrictions are
  // typically enforced only for browser-based requests and may not stop
  // someone using the extracted key from a script or other HTTP client.
  const OPENROUTER_API_KEY = "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";
  // =====================================================================

  const conversation = [];

  function checkPassword() {
    const input = document.getElementById('password-input');
    const error = document.getElementById('gate-error');
    if (input.value === SITE_PASSWORD) {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      document.getElementById('user-input').focus();
    } else {
      error.textContent = 'Incorrect password.';
      input.value = '';
      input.focus();
    }
  }

  document.getElementById('password-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkPassword();
  });

  const messagesEl = document.getElementById('messages');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const modelInput = document.getElementById('model-input');

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // auto-grow textarea
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });

  function addMessage(role, text, rawData) {
    // Wrapper lets us stack the bubble + a "view JSON" button underneath it.
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + (role === 'user' ? 'user' : 'ai');

    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    wrap.appendChild(div);

    if (rawData !== undefined) {
      const btn = document.createElement('button');
      btn.className = 'json-btn';
      btn.textContent = '</> View JSON';
      btn.onclick = () => openJsonModal(rawData);
      wrap.appendChild(btn);
    }

    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  // ---------- JSON dev modal ----------
  let currentJsonText = '';

  function openJsonModal(rawData) {
    currentJsonText = typeof rawData === 'string' ? rawData : JSON.stringify(rawData, null, 2);
    document.getElementById('json-modal-body').textContent = currentJsonText;
    document.getElementById('json-modal-overlay').style.display = 'flex';
  }

  function closeJsonModal() {
    document.getElementById('json-modal-overlay').style.display = 'none';
  }

  function copyJson() {
    navigator.clipboard.writeText(currentJsonText).catch(() => {});
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeJsonModal();
  });

  async function sendMessage() {
    const text = userInput.value.trim();
    const model = modelInput.value.trim();

    if (!text) return;
    if (!model) {
      addMessage('error', 'Please enter a model ID first (e.g. openai/gpt-4o-mini).');
      return;
    }

    addMessage('user', text);
    conversation.push({ role: 'user', content: text });
    userInput.value = '';
    userInput.style.height = 'auto';

    sendBtn.disabled = true;
    const typingEl = addMessage('system', 'AI is thinking...');
    typingEl.classList.add('typing');

    try {
      const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + OPENROUTER_API_KEY,
          'HTTP-Referer': window.location.href,
          'X-Title': 'Single File Chat'
        },
        body: JSON.stringify({
          model: model,
          messages: conversation
        })
      });

      const data = await response.json();
      typingEl.remove();

      if (!response.ok) {
        const errMsg = (data && data.error && data.error.message) || ('HTTP ' + response.status);
        addMessage('error', 'Error: ' + errMsg, data);
        return;
      }

      const reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (reply) {
        addMessage('ai', reply, data);
        conversation.push({ role: 'assistant', content: reply });
      } else {
        addMessage('error', 'No response content received from the model.', data);
      }
    } catch (err) {
      typingEl.remove();
      addMessage('error', 'Request failed: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }
</script>
</body>
</html>
